<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JoApp — Oiseaux</title>
<link rel="manifest" href="../../manifest.json">
<link rel="icon" href="../../icon.svg">
<link rel="stylesheet" href="../../shared/style.css">
<meta name="theme-color" content="#8902CC">
</head>
<body>
<header class="app-header">
  <a class="back-btn" href="../../categories/animaux/oiseaux/index.html">←</a>
  <h1>JoApp</h1>
  <button class="menu-btn" aria-label="Menu">⋯</button>
</header>
<div id="stats-bar"></div>
<div class="mode-subtitle">
  <span>photo → nom</span>
  <span id="session-timer">0s</span>
</div>
<main id="app">
  <div id="quiz">
    <div id="photo-wrapper">
      <img id="bird-photo" src="" alt="Photo d'oiseau à identifier">
      <span id="box-badge"></span>
    </div>
    <div class="hud-row">
      <div id="hearts">
        <span class="heart">♥</span>
        <span class="heart">♥</span>
        <span class="heart">♥</span>
      </div>
      <span id="round-counter">1/20</span>
    </div>
    <input type="text" id="answer-input" placeholder="Nom de l'oiseau" autocomplete="off">
    <div class="button-row">
      <button id="submit-btn">Valider</button>
      <button id="skip-btn">Je ne sais pas</button>
    </div>
    <p id="feedback"></p>
  </div>
  <div id="session-end" style="display:none;">
    <h2>Session terminée !</h2>
    <div id="session-recap"></div>
    <a href="../../categories/animaux/oiseaux/index.html" class="button-link">← Retour aux modes</a>
  </div>
</main>
<script src="../../shared/utils.js"></script>
<script src="../../shared/storage.js"></script>
<script src="../../shared/gamification.js"></script>
<script src="../../shared/render-stats.js"></script>
<script src="birds.js"></script>
<script src="game.js"></script>
</body>
</html>
