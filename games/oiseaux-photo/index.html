<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JoApp — Oiseaux</title>
<link rel="manifest" href="../../manifest.json">
<link rel="icon" href="../../icon.svg">
<link rel="stylesheet" href="../../shared/style.css">
<meta name="theme-color" content="#58cc02">
</head>
<body>
<header>
  <a href="../../index.html" id="back-link">← JoApp</a>
  <h1>Oiseaux — Photo → Nom</h1>
  <div id="stats-bar"></div>
</header>
<main id="app">
  <div id="quiz">
    <div id="photo-wrapper">
      <img id="bird-photo" src="" alt="Photo d'oiseau à identifier">
      <span id="box-badge"></span>
    </div>
    <p id="attempts">Tentative <span id="attempt-count">1</span>/4</p>
    <input type="text" id="answer-input" placeholder="Nom de l'oiseau" autocomplete="off">
    <button id="submit-btn">Valider</button>
    <p id="feedback"></p>
  </div>
  <div id="session-end" style="display:none;">
    <h2>Session terminée !</h2>
    <div id="session-recap"></div>
    <a href="../../index.html" class="button-link">← Retour à l'accueil</a>
  </div>
</main>
<script src="../../shared/utils.js"></script>
<script src="../../shared/storage.js"></script>
<script src="../../shared/gamification.js"></script>
<script src="../../shared/render-stats.js"></script>
<script src="birds.js"></script>
<script src="game.js"></script>
</body>
</html>
